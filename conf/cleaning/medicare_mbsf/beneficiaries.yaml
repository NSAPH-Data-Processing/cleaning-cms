# conf/cleaning/beneficiaries.yaml
# Cleaning rules for the CMS beneficiary summary table.
# Used by Approach A (strategy registry).
#
# For each variable, assign one of the built-in strategies:
#   mode            - most frequent non-null value
#   min             - smallest non-null value
#   max             - largest non-null value
#   most_recent     - last non-null value (arrays must be time-ordered upstream)
#   prefer_nonmissing - first non-null value; falls back to mode if all missing
#   ever_nonzero    - 1 if any value is nonzero/non-null, else 0
#   require_stable  - keeps value if n_distinct == 1, else nulls it out
#
# Use sql: for one-off expressions that the registry cannot express cleanly.

# conf/cleaning/beneficiaries.yaml
table: beneficiaries_test
primary_key:
  - bene_id
mode: array
default_strategy: mode

variables:
  # --- Demographics ---
  dob:
    strategy: min                 # date of birth stable; take earliest non-null
  sex:
    strategy: prefer_nonmissing
    missing_codes: [0]            # 0 = unknown; treat as missing
  race:
    strategy: mode                # most common recorded value across years
  # --- Death ---
  dod:
    strategy: min                 # earliest recorded death date if disagreement

cleaning_rules:
  across_columns:
    death_after_dob:
      rule: date_order
      earlier: dob
      later: dod
      on_violation: null_later    # null out dod if it precedes dob