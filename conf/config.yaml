# conf/config.yaml
# Hydra runner config for clean-cms
# Controls input/output paths and which table/years to clean.

defaults:
  - datapaths: medicare_mbsf
  - _self_

# I/O directories (data/{datapaths.name}/{input,intermediate,cleaned}) are derived from
# datapaths.name in cleancms.utils.build_stage_dirs / the Snakefile — not repeated here.

# --- Table selection ---
dataset: medicare_mbsf        # dataset namespace under conf/cleaning/{dataset}/{table}.yaml
table: enrollments            # which table to clean (must match a cleaning config)
year_min: 2000
year_max: 2001
shard: null                       # set to a shard value (e.g. "CA") to process a single shard

# --- Runtime options ---
dry_run: false        # if true, print generated SQL but do not write output
log_level: INFO
