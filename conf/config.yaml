# conf/config.yaml
# Hydra runner config for clean-cms
# Controls input/output paths and which table/years to clean.

defaults:
  - cleaning: beneficiaries   # loads conf/cleaning/beneficiaries.yaml
  - _self_

# --- I/O ---
input_dir: data/normalized        # directory containing _array.parquet files
intermediate_dir: data/intermediate  # directory for resolved and rules parquet files
output_dir: data/cleaned          # directory to write _clean.parquet files

# --- Table selection ---
table: beneficiaries              # which table to clean (must match a cleaning config)
year_min: 2008
year_max: 2010

# --- Sharding ---
# Set to true when the previous step produced one file per year
# (e.g. {table}_{year}_array.parquet) rather than a single combined file
# (e.g. {table}_{year_min}_{year_max}_array.parquet).
# Output will match: sharded input → sharded output, combined → combined.
sharded: false

# --- Derived filenames (informational; controlled by runner) ---
# sharded=false: {input_dir}/{table}_{year_min}_{year_max}_array.parquet  → ... → {output_dir}/{table}_{year_min}_{year_max}_clean.parquet
# sharded=true:  {input_dir}/{table}_{year}_array.parquet (per year)      → ... → {output_dir}/{table}_{year}_clean.parquet (per year)

# --- Runtime options ---
dry_run: false        # if true, print generated SQL but do not write output
log_level: INFO
